x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://orderflow:orderflow@db:5432/orderflow
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  SECRET_KEY: dev-secret-do-not-use-in-production
  INVOICE_DIR: /app/data/invoices

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  api:
    build: .
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    volumes:
      - invoices:/app/data/invoices
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    environment:
      <<: *app-env
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - invoices:/app/data/invoices
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    environment:
      <<: *app-env
    command: celery -A app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  flower:
    build: .
    environment:
      <<: *app-env
    ports:
      - "5555:5555"
    command: celery -A app.celery_app flower --port=5555
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  invoices:
